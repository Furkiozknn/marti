<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320" role="img" aria-labelledby="t d">
<title id="t">Martı · oyun şarkısı stili / song-video style</title>
<desc id="d">Banner for Martı in the style of its song video: blue ground with sunburst rays, a yellow badge and button, white serif lettering, a stylized seagull carrying a simit over the strait with a bridge and a red-and-white ferry below, a fluffy chick in a straw nest on a terracotta roof.</desc>
<defs>
<clipPath id="card"><rect width="1280" height="320" rx="24"/></clipPath>
<linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F0D080"/><stop offset="1" stop-color="#F8E8D0"/></linearGradient>
<linearGradient id="fade" x1="0" x2="1"><stop offset="0" stop-color="#085888"/><stop offset=".6" stop-color="#085888" stop-opacity=".93"/><stop offset="1" stop-color="#085888" stop-opacity="0"/></linearGradient>
</defs>
<g clip-path="url(#card)">
<rect width="1280" height="320" fill="#085888"/>
<g fill="#287088" opacity=".5"><path d="M900 160 L560 -40 L640 -60 z"/><path d="M900 160 L860 -80 L960 -80 z"/><path d="M900 160 L1160 -60 L1240 -20 z"/><path d="M900 160 L1300 100 L1300 20 z"/></g>
<rect x="600" width="680" height="190" fill="url(#sky)" opacity=".9"/>
<!-- bridge -->
<g fill="#8a7a78" opacity=".85"><rect x="640" y="116" width="640" height="6"/><rect x="760" y="70" width="9" height="90"/><rect x="1100" y="70" width="9" height="90"/></g>
<path d="M764 76 Q930 130 1104 76" stroke="#8a7a78" stroke-width="2.5" fill="none" opacity=".8"/>
<!-- sea -->
<rect y="190" width="1280" height="130" fill="#88C8D0"/>
<g stroke="#F8F8F8" stroke-width="2" opacity=".35" fill="none"><path d="M640 224 h120"/><path d="M820 250 h160"/><path d="M1020 276 h180"/><path d="M700 292 h140"/></g>
<!-- ferry -->
<g>
<path d="M650 262 h210 l-20 32 h-176 z" fill="#F8F8F8"/>
<rect x="666" y="238" width="172" height="26" rx="5" fill="#F8F8F8"/>
<g fill="#085888"><rect x="680" y="246" width="18" height="10" rx="2"/><rect x="706" y="246" width="18" height="10" rx="2"/><rect x="732" y="246" width="18" height="10" rx="2"/><rect x="758" y="246" width="18" height="10" rx="2"/></g>
<path d="M650 276 h210" stroke="#B82818" stroke-width="6"/>
<rect x="796" y="216" width="26" height="26" rx="3" fill="#D84030"/>
</g>
<!-- roof with nest and chick -->
<path d="M1040 190 L1190 190 L1230 256 L1000 256 z" fill="#984828"/>
<path d="M1040 190 L1190 190 L1196 200 L1034 200 z" fill="#A85830"/>
<ellipse cx="1115" cy="176" rx="46" ry="14" fill="#C09050"/>
<circle cx="1115" cy="158" r="20" fill="#B8B8C0"/><circle cx="1108" cy="156" r="3" fill="#281808"/><circle cx="1122" cy="156" r="3" fill="#281808"/><path d="M1109 164 l6 8 l6 -8 z" fill="#F0B038"/>
<!-- seagull with simit -->
<g>
<path d="M930 120 q-70 -52 -130 -14 q54 6 82 34 z" fill="#F8F8F8"/>
<path d="M930 120 q60 -56 136 -22 q-56 8 -84 40 z" fill="#E8E8EE"/>
<ellipse cx="934" cy="140" rx="46" ry="22" fill="#F8F8F8"/>
<circle cx="982" cy="128" r="18" fill="#F8F8F8"/>
<path d="M998 126 l30 8 l-30 8 z" fill="#F8D038"/>
<circle cx="988" cy="124" r="2.6" fill="#281808"/><path d="M978 116 l16 4" stroke="#281808" stroke-width="2.5"/>
<circle cx="1028" cy="152" r="17" fill="none" stroke="#C88838" stroke-width="9"/>
<g fill="#F8F0D8"><circle cx="1018" cy="146" r="1.6"/><circle cx="1036" cy="146" r="1.6"/><circle cx="1030" cy="165" r="1.6"/><circle cx="1014" cy="158" r="1.6"/></g>
</g>
<g fill="none" stroke="#F8F8F8" stroke-width="2.4" stroke-linecap="round" opacity=".9"><path d="M700 60 q8 -8 16 0 q8 -8 16 0"/><path d="M1180 50 q8 -8 16 0 q8 -8 16 0"/></g>
</g>
<rect width="760" height="320" fill="url(#fade)" clip-path="url(#card)"/>
<g font-family="Georgia, 'Times New Roman', serif">
<text x="56" y="62" font-size="18" letter-spacing="3" fill="#F8F8F8">TURKISH IS EASY… FOR A SEAGULL?</text>
<rect x="56" y="72" width="380" height="3" fill="#D84030"/>
<text x="52" y="168" font-size="96" font-weight="700" letter-spacing="2" fill="#F8F8F8">MARTI</text>
<text x="56" y="214" font-size="26" letter-spacing="1" fill="#F8D038">Boğaz'da simit avı</text>
<text x="56" y="254" font-size="20" fill="#F8F8F8" opacity=".92">Martı, martı, kap o simit!</text>
<rect x="56" y="272" width="214" height="34" rx="17" fill="#F8D038"/>
<text x="163" y="295" font-size="17" font-weight="700" text-anchor="middle" fill="#085888">▶ OYNA · PLAY</text>
<text x="290" y="295" font-size="15" fill="#F8F8F8" opacity=".8">furkiozknn.github.io/marti</text>
</g>
</svg>
